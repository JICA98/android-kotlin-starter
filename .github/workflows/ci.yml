name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Unit + integration tests
        run: bun test
      - name: Snapshot consistency
        run: bun run scripts/check-snapshot.ts

  render-smoke:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        stack-channel: [stable, bleeding-edge]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: bun install
      - name: Scaffold single (${{ matrix.stack-channel }})
        run: |
          bun run src/cli.ts /tmp/out/single \
            --name=Smoke \
            --package=com.example.smoke \
            --arch=single \
            --stack-channel=${{ matrix.stack-channel }} \
            --no-install
          ls /tmp/out/single/Smoke
      - name: Scaffold multi (${{ matrix.stack-channel }})
        run: |
          bun run src/cli.ts /tmp/out/multi \
            --name=Smoke \
            --package=com.example.smoke \
            --arch=multi \
            --stack-channel=${{ matrix.stack-channel }} \
            --no-install
          ls /tmp/out/multi/Smoke
      - name: Assert stack tokens (${{ matrix.stack-channel }})
        run: |
          set -euo pipefail
          CHANNEL="${{ matrix.stack-channel }}"
          EXPECT_SDK=$(bun -e "const s=require('./stack/${CHANNEL}.json'); process.stdout.write(String(s.compileSdk))")
          EXPECT_AGP=$(bun -e "const s=require('./stack/${CHANNEL}.json'); process.stdout.write(s.agp)")
          grep -q "compileSdk = ${EXPECT_SDK}" /tmp/out/single/Smoke/app/build.gradle.kts
          grep -q "${EXPECT_AGP}" /tmp/out/multi/Smoke/gradle/libs.versions.toml
          echo "OK ${CHANNEL}: compileSdk=${EXPECT_SDK} agp=${EXPECT_AGP}"
      - name: Gradle help (single)
        run: |
          cd /tmp/out/single/Smoke
          ./gradlew help
      - name: Gradle help (multi)
        run: |
          cd /tmp/out/multi/Smoke
          ./gradlew help
      - name: Gradle dependencies (app releaseRuntimeClasspath)
        run: |
          cd /tmp/out/single/Smoke
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon
      - name: Build APK (single debug)
        run: |
          cd /tmp/out/single/Smoke
          ./gradlew :app:assembleDebug --no-daemon
      - name: Build APK (single release)
        run: |
          cd /tmp/out/single/Smoke
          ./gradlew :app:assembleRelease --no-daemon
      - name: Build APK (multi release)
        run: |
          cd /tmp/out/multi/Smoke
          ./gradlew :app:assembleRelease --no-daemon
